<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="216mm" viewBox="0 0 106 216">
<!-- ============================================================
     Masa Standi ON YUZ sablonu - v2 (krem/altin)
     Kesim: 100x210 mm (DL dik) | Tasma dahil: 106x216 (3 mm bleed)
     Guvenli alan: kesimden 5 mm iceride (x 8-98, y 8-208)
     MARKA RENGI (accent): #B58A3E - tum bu hex'i find/replace ile degistir
     BASKI NOTU: yazilari baskidan once OUTLINE'a cevir (font gomme)
     Yer tutucular (tasarim.js doldurur):
       LOGO_BLOK : opsiyonel logo (PNG/JPG, ust alana gomulur; yoksa bos)
       AD_BLOK   : isletme adi (logo varsa asagi iner ve tek satir olur;
                   logosuz uzun ad iki satira bolunur, punto kuculur)
       QR        : vektorel QR (44x44 mm, x=31 y=84.5 konumuna gomulur)
     NFC dairesinin KONUMU SABITTIR (fiziksel cip arkasina gelir).
     ============================================================ -->
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FBFAF7"/><stop offset="1" stop-color="#F1EFE8"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="106" height="216" fill="url(#paper)"/>

<g font-family="'Helvetica Neue',Arial,sans-serif">
  <!-- top accent rule -->
  <rect x="44.0" y="16" width="18" height="0.9" rx="0.45" fill="#B58A3E"/>

  <!-- logo (opsiyonel, dinamik) -->
{{LOGO_BLOK}}

  <!-- isletme adi (dinamik) -->
{{AD_BLOK}}

  <!-- Headline -->
  <text x="53.0" y="49"   text-anchor="middle" font-size="9.2" font-weight="800" fill="#1B1B1F" letter-spacing="-0.2">Deneyiminizi</text>
  <text x="53.0" y="59.4" text-anchor="middle" font-size="9.2" font-weight="800" fill="#B58A3E" letter-spacing="-0.2">Google'da paylaşın</text>

  <!-- Stars: ICI BOS (outline) - puani musteri secer, Google politikasi -->
  <g fill="none" stroke="#B58A3E" stroke-width="0.55" stroke-linejoin="round">
    <path d="M35.80,61.80L36.46,63.59L38.37,63.67L36.87,64.85L37.39,66.68L35.80,65.62L34.21,66.68L34.73,64.85L33.23,63.67L35.14,63.59Z"/>
    <path d="M44.40,61.80L45.06,63.59L46.97,63.67L45.47,64.85L45.99,66.68L44.40,65.62L42.81,66.68L43.33,64.85L41.83,63.67L43.74,63.59Z"/>
    <path d="M53.00,61.80L53.66,63.59L55.57,63.67L54.07,64.85L54.59,66.68L53.00,65.62L51.41,66.68L51.93,64.85L50.43,63.67L52.34,63.59Z"/>
    <path d="M61.60,61.80L62.26,63.59L64.17,63.67L62.67,64.85L63.19,66.68L61.60,65.62L60.01,66.68L60.53,64.85L59.03,63.67L60.94,63.59Z"/>
    <path d="M70.20,61.80L70.86,63.59L72.77,63.67L71.27,64.85L71.79,66.68L70.20,65.62L68.61,66.68L69.13,64.85L67.63,63.67L69.54,63.59Z"/>
  </g>

  <!-- subline -->
  <text x="53.0" y="73" text-anchor="middle" font-size="3.3" fill="#8A8A90">30 saniyenizi ayırın — çok memnun oluruz</text>

  <!-- QR card -->
  <rect x="21.0" y="79.4" width="64.0" height="70.0" rx="5" fill="#E4DFD1" opacity="0.7"/>
  <rect x="21.0" y="78.0" width="64.0" height="70.0" rx="5" fill="#FFFFFF" stroke="#EAE6DA" stroke-width="0.4"/>
{{QR}}
  <g stroke="#B58A3E" stroke-width="0.8" stroke-linecap="round" fill="none">
    <path d="M28.5 87.5V83.0H34.0"/>
    <path d="M72.0 83.0H77.5V87.5"/>
    <path d="M28.5 125.5V130.0H34.0"/>
    <path d="M72.0 130.0H77.5V125.5"/>
  </g>
  <text x="53.0" y="143.5" text-anchor="middle" font-size="3.7" font-weight="700" fill="#1B1B1F" letter-spacing="0.3">Kamerayı QR koda tutun</text>

  <!-- divider -->
  <line x1="24" y1="156" x2="46" y2="156" stroke="#D8D3C5" stroke-width="0.4"/>
  <line x1="60" y1="156" x2="82" y2="156" stroke="#D8D3C5" stroke-width="0.4"/>
  <text x="53.0" y="157.4" text-anchor="middle" font-size="4" font-weight="600" fill="#8A8A90">veya</text>

  <!-- NFC dokunma alani (fiziksel cip bu dairenin arkasina - KONUM SABIT) -->
  <circle cx="53.0" cy="173.5" r="11.5" fill="#B58A3E" opacity="0.08"/>
  <g transform="translate(53.0,173.5) scale(0.9)">
    <g transform="translate(-9,-8)">
      <rect x="0" y="0" width="9" height="16" rx="1.8" fill="none" stroke="#B58A3E" stroke-width="1"/>
      <line x1="3" y1="2" x2="6" y2="2" stroke="#B58A3E" stroke-width="1" stroke-linecap="round"/>
      <circle cx="4.5" cy="13.6" r="0.7" fill="#B58A3E"/>
    </g>
    <g transform="translate(1.5,0)" fill="none" stroke="#B58A3E" stroke-width="1.1" stroke-linecap="round">
      <path d="M0 -3 A3 3 0 0 1 0 3"/>
      <path d="M2.4 -5.2 A5.4 5.4 0 0 1 2.4 5.2"/>
      <path d="M4.8 -7.4 A7.7 7.7 0 0 1 4.8 7.4"/>
    </g>
  </g>
  <text x="53.0" y="188.5" text-anchor="middle" font-size="4.3" font-weight="700" fill="#1B1B1F">Telefonu buraya yaklaştırın</text>
  <text x="53.0" y="193.1" text-anchor="middle" font-size="3.1" fill="#8A8A90">NFC destekli telefonlarda otomatik açılır</text>

  <!-- Footer -->
  <text x="53.0" y="203" text-anchor="middle" font-size="2.9" fill="#8A8A90" letter-spacing="0.4">değerlendirme platformu</text>
  <text x="53.0" y="209.4" text-anchor="middle" font-size="6.6" font-weight="700" letter-spacing="-0.3"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan></text>
</g>

<!-- kesim izleri (trim: x 3-103, y 3-213) -->
<g stroke="#000" stroke-width="0.2">
  <line x1="0" y1="3" x2="2" y2="3"/><line x1="3" y1="0" x2="3" y2="1.5"/>
  <line x1="104" y1="3" x2="106" y2="3"/><line x1="103" y1="0" x2="103" y2="1.5"/>
  <line x1="0" y1="213" x2="2" y2="213"/><line x1="3" y1="214.5" x2="3" y2="216"/>
  <line x1="104" y1="213" x2="106" y2="213"/><line x1="103" y1="214.5" x2="103" y2="216"/>
</g>
</svg>
