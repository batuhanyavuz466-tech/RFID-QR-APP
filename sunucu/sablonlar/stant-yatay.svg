<svg xmlns="http://www.w3.org/2000/svg" width="146mm" height="106mm" viewBox="0 0 146 106">
<!-- ============================================================
     Masa Standi YATAY sablonu (koyu panel + krem)
     Kesim: 140x100 mm | Tasma dahil: 146x106 (3 mm bleed)
     Guvenli alan: kesimden 5 mm iceride (x 8-138, y 8-98)
     PANEL RENGI: #164049 / #0F2E35 | ACCENT (altin): #E0B968
     BASKI NOTU: yazilari baskidan once OUTLINE'a cevir (font gomme)
     Yer tutucular (tasarim.js doldurur):
       LOGO_BLOK : opsiyonel logo (sol panel ust alani; yoksa bos)
       AD_BLOK   : isletme adi (sola dayali; logo varsa altina iner)
       QR        : vektorel QR (38x38 mm, x=96 y=28 konumuna gomulur)
     ============================================================ -->
<defs>
<linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FBFAF7"/><stop offset="1" stop-color="#F1EFE8"/>
</linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#164049"/><stop offset="1" stop-color="#0F2E35"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="146" height="106" fill="url(#cream)"/>
<!-- sol marka paneli (tasmali) -->
<path d="M0 0 H86 L80 106 H0 Z" fill="url(#panel)"/>

<g font-family="'Helvetica Neue',Arial,sans-serif">
  <!-- logo (opsiyonel, dinamik) -->
{{LOGO_BLOK}}

  <!-- isletme adi (dinamik) -->
{{AD_BLOK}}

  <!-- baslik (sola dayali, 3 satir - panele sigar) -->
  <text x="15.0" y="42"   font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="-0.2">Deneyiminizi</text>
  <text x="15.0" y="51.6" font-size="9" font-weight="800" fill="#E0B968"  letter-spacing="-0.2">Google'da</text>
  <text x="15.0" y="61.2" font-size="9" font-weight="800" fill="#E0B968"  letter-spacing="-0.2">paylaşın</text>

  <!-- yildizlar: ICI BOS (outline) - puani musteri secer, Google politikasi -->
  <g fill="none" stroke="#E0B968" stroke-width="0.5" stroke-linejoin="round">
    <path d="M17.40,66.50L18.02,68.15L19.78,68.23L18.40,69.32L18.87,71.02L17.40,70.05L15.93,71.02L16.40,69.32L15.02,68.23L16.78,68.15Z"/>
    <path d="M25.00,66.50L25.62,68.15L27.38,68.23L26.00,69.32L26.47,71.02L25.00,70.05L23.53,71.02L24.00,69.32L22.62,68.23L24.38,68.15Z"/>
    <path d="M32.60,66.50L33.22,68.15L34.98,68.23L33.60,69.32L34.07,71.02L32.60,70.05L31.13,71.02L31.60,69.32L30.22,68.23L31.98,68.15Z"/>
    <path d="M40.20,66.50L40.82,68.15L42.58,68.23L41.20,69.32L41.67,71.02L40.20,70.05L38.73,71.02L39.20,69.32L37.82,68.23L39.58,68.15Z"/>
    <path d="M47.80,66.50L48.42,68.15L50.18,68.23L48.80,69.32L49.27,71.02L47.80,70.05L46.33,71.02L46.80,69.32L45.42,68.23L47.18,68.15Z"/>
  </g>

  <!-- alt satir -->
  <text x="15.0" y="78" font-size="3.2" fill="#AEC3C8">30 saniyenizi ayırın — çok memnun oluruz</text>

  <!-- NFC kisa ipucu (fiziksel cip bu bolgenin arkasina - KONUM SABIT) -->
  <g transform="translate(18.5,92) scale(0.5)">
    <g transform="translate(-9,-8)">
      <rect x="0" y="0" width="9" height="16" rx="1.8" fill="none" stroke="#E0B968" stroke-width="1.4"/>
      <line x1="3" y1="2" x2="6" y2="2" stroke="#E0B968" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="4.5" cy="13.6" r="0.8" fill="#E0B968"/>
    </g>
    <g transform="translate(1.5,0)" fill="none" stroke="#E0B968" stroke-width="1.5" stroke-linecap="round">
      <path d="M0 -3 A3 3 0 0 1 0 3"/><path d="M2.4 -5.2 A5.4 5.4 0 0 1 2.4 5.2"/>
    </g>
  </g>
  <text x="26.0" y="90.5" font-size="3.5" font-weight="700" fill="#FFFFFF">veya telefonu yaklaştırın</text>
  <text x="26.0" y="94.8" font-size="2.7" fill="#AEC3C8">NFC destekli telefonlarda açılır</text>

  <!-- SAG: QR karti (38 mm QR + ~5 mm sessiz alan) -->
  <rect x="91.0" y="23.2" width="48.0" height="60.0" rx="4.5" fill="#E4DFD1" opacity="0.6"/>
  <rect x="91.0" y="22.0" width="48.0" height="60.0" rx="4.5" fill="#FFFFFF" stroke="#EAE6DA" stroke-width="0.4"/>
{{QR}}
  <g stroke="#E0B968" stroke-width="0.8" stroke-linecap="round" fill="none">
    <path d="M93.8 30.6V26.7H98.6"/>
    <path d="M131.4 26.7H136.2V30.6"/>
    <path d="M93.8 63.4V67.3H98.6"/>
    <path d="M131.4 67.3H136.2V63.4"/>
  </g>
  <text x="115.0" y="78.0" text-anchor="middle" font-size="3.4" font-weight="700" fill="#213238" letter-spacing="0.2">Kamerayı QR koda tutun</text>

  <!-- alt bilgi -->
  <text x="115.0" y="90" text-anchor="middle" font-size="2.6" fill="#8A8A90" letter-spacing="0.3">değerlendirme platformu</text>
  <text x="115.0" y="96.5" text-anchor="middle" font-size="6" font-weight="700" letter-spacing="-0.3"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan></text>
</g>

<!-- kesim izleri (trim: x 3-143, y 3-103) -->
<g stroke="#000" stroke-width="0.2">
  <line x1="0" y1="3" x2="1.5" y2="3"/><line x1="3" y1="0" x2="3" y2="1.5"/>
  <line x1="144.5" y1="3" x2="146" y2="3"/><line x1="143" y1="0" x2="143" y2="1.5"/>
  <line x1="0" y1="103" x2="1.5" y2="103"/><line x1="3" y1="104.5" x2="3" y2="106"/>
  <line x1="144.5" y1="103" x2="146" y2="103"/><line x1="143" y1="104.5" x2="143" y2="106"/>
</g>
</svg>
